name: Build and Push to DockerHub
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the image"
        required: true
        default: "v0.0.0"

jobs:
  build-and-push:
    name: Build Image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set version variable
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            REF_TAG=${GITHUB_REF#refs/tags/}
            echo "TAG=$REF_TAG" >> $GITHUB_ENV
            echo "tag=$REF_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image with multiple tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ${{ secrets.DH_REGISTRY }}/pbe:${{ steps.set-tag.outputs.tag }}
            ${{ secrets.DH_REGISTRY }}/pbe:latest

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-push.outputs.tag }}
          name: pbe:${{ needs.build-and-push.outputs.tag }} docker image
          body: |
            [${{ secrets.DOCKER_USERNAME }}/pbe:latest](https://hub.docker.com/layers/${{ secrets.DOCKER_USERNAME }}/pbe/latest)
            [${{ secrets.DOCKER_USERNAME }}/pbe:${{ needs.build-and-push.outputs.tag }}](https://hub.docker.com/layers/${{ secrets.DOCKER_USERNAME }}/pbe/${{ needs.build-and-push.outputs.tag }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
